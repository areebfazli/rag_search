[project]
name = "semantic-search-rag"
version = "0.1.0"
description = "Hybrid semantic search with RAG engine: BM25 + dense embeddings fused with RRF, cross-encoder reranking, grounded RAG answers, and a retrieval/RAG evaluation harness."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "ir-datasets>=0.5",
    "ranx>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    # OpenAI-compatible client for RAG generation (Groq/Ollama/OpenAI). Core because
    # /answer and app/eval/rag_eval depend on it.
    "openai>=1.40",
    # Per-IP rate limiting for the unauthenticated API.
    "slowapi>=0.1.9",
    # Declared explicitly (it would otherwise arrive transitively via
    # sentence-transformers) so the CPU-only index below applies to it.
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
# This is an application, not a library — manage the env + deps but don't build
# and install the `app` package itself. Run modules from the project root.
package = false

# Nothing here uses a GPU — embedding, reranking and eval all run on CPU. Without
# this, resolving torch on Linux drags in ~37 nvidia-* CUDA wheels (~2.7 GB) that
# are dead weight in the image. macOS/other platforms keep the PyPI build, which is
# already CPU-only there.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
