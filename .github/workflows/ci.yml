name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The suite runs on fakes — no models, no index, no LLM key. Offline mode turns an
      # accidental model load into a fast failure instead of a silent download.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # --locked: install exactly uv.lock (CPU-only torch on Linux), and fail if it is
      # out of date with pyproject.toml rather than re-resolving.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test
